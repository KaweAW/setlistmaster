<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B2038" />
    <meta name="description" content="Setlists, chords and charts for the stage" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Scaletta" />
    <title>Scaletta</title>
  </head>
  <body>
    <script>
      // Dark theme / stage mode are saved by the app; applying them here avoids a flash of the light theme.
      try {
        var ui = JSON.parse(localStorage.getItem('scaletta-ui')).state;
        if (ui.theme === 'dark' || ui.stageMode) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
